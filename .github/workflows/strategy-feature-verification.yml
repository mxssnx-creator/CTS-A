name: Strategy feature verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      CTS_BUILD_NODE_HEAP_MB: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:strategy-features
      - run: node --experimental-strip-types --test --test-name-pattern='Block hour-PF losses gate only' src/lib/desk/block-dca.test.ts
      - run: npm run test:lastn-blocks
      - run: node --experimental-strip-types --test src/lib/desk/project-order-identity.test.ts
      - run: node --experimental-strip-types --test src/lib/desk/disjoint-last-n.test.ts
      - run: node --experimental-strip-types --test src/lib/desk/fee-policy.test.ts src/lib/desk/fee-integration.test.ts
      - run: node --require ./scripts/lib/offline-test-guard.cjs --experimental-strip-types scripts/sim-12-symbol-price-grid.mjs --selection-hours=6 --validation-hours=6
      - run: node --require ./scripts/lib/offline-test-guard.cjs --experimental-strip-types scripts/sim-12-symbol-price-grid.mjs --minimal --selection-hours=6 --validation-hours=6
      - run: node --require ./scripts/lib/offline-test-guard.cjs --experimental-strip-types scripts/sim-12-symbol-price-grid.mjs --short --selection-hours=6 --validation-hours=6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cts-a-price-grid-replays-${{ github.sha }}
          path: |
            artifacts/cts-a-price-grid-replay.*
            artifacts/cts-a-minimal-price-grid-replay.*
            artifacts/cts-a-short-price-grid-replay.*
          if-no-files-found: error
      - run: npm run build:dev
      - run: node --test scripts/trailing-control-policy.test.mjs
      - run: npm run test:execution-offline
